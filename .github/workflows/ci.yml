name: Build and test
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build universal DMG
        run: bash scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SSwitcher-macOS
          path: |
            build/SSwitcher-*-universal.dmg
            build/SSwitcher-*-universal.dmg.sha256
